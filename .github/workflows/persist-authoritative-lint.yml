name: Persist Authoritative Lint Diagnostic

on:
  push:
    branches:
      - feat/meal-builder-authoritative-option-groups
    paths:
      - .github/workflows/persist-authoritative-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Capture lint output
        shell: bash
        run: |
          mkdir -p .qa-debug
          set +e
          npm run lint > .qa-debug/lint.log 2>&1
          echo "exit_code=$?" >> .qa-debug/lint.log
      - name: Commit diagnostic
        run: |
          git config user.name 'Basic Diet Frontend'
          git config user.email 'actions@users.noreply.github.com'
          git add -f .qa-debug/lint.log
          git commit -m 'chore(meal-builder): record lint diagnostic'
          git push origin HEAD:feat/meal-builder-authoritative-option-groups
