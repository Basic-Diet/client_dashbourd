name: Meal Builder Focused Diagnostic

on:
  pull_request:
    branches:
      - feat/meal-builder-authoritative-option-groups
    types: [opened]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/meal_builder_family_tabs_repair.py
      - run: npm ci --silent
      - name: Authoritative option-group test
        id: authoritative
        continue-on-error: true
        run: npx vitest run tests/mealPlannerAuthoritativeOptionGroups.test.tsx > authoritative.log 2>&1
      - name: Card visibility test
        id: visibility
        continue-on-error: true
        run: npx vitest run tests/mealPlannerCardDataVisibility.test.tsx > visibility.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meal-builder-focused-logs
          path: |
            authoritative.log
            visibility.log
      - name: Enforce tests
        if: steps.authoritative.outcome == 'failure' || steps.visibility.outcome == 'failure'
        run: exit 1
