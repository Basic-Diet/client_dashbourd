name: Manual balance UI validation

on:
  pull_request:
    paths:
      - "src/components/pages/manual-deduction/**"
      - "src/types/subscriptionTypes.ts"
      - ".github/workflows/manual-balance-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
