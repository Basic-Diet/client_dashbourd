name: Meal Builder Frontend Closure QA

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .qa/run-closure.txt
  workflow_dispatch:

concurrency:
  group: meal-builder-authenticated-crud-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FRONTEND_URL: http://127.0.0.1:5173
      BACKEND_URL: https://basicdiet145.onrender.com
      VITE_BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare evidence directories
        run: mkdir -p .qa-artifacts .qa-option-artifacts .qa-closure

      - name: Install project dependencies
        run: npm ci --silent

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Full ESLint
        run: npm run lint

      - name: Full unit and component suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium runtime without changing lockfiles
        run: |
          npm install --no-save --package-lock=false --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Serve the exact production build
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 5173 > .qa-closure/vite-preview.log 2>&1 &
          echo $! > .qa-closure/vite-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo 'Local production build is ready.'
              exit 0
            fi
            sleep 1
          done
          cat .qa-closure/vite-preview.log || true
          exit 1

      - name: Authenticated direct-card CRUD, validation, delete, and mobile QA
        run: node .qa/meal-builder-authenticated-qa.mjs

      - name: Reversible option-family picker and PUT-items QA
        run: node .qa/meal-builder-option-family-qa.mjs

      - name: Repository diff integrity
        run: git diff --check

      - name: Publish closure summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Meal Builder Frontend Closure Evidence'
            echo
            echo '## Direct CRUD report'
            echo '```json'
            cat .qa-artifacts/meal-builder-qa-report.json || echo '{"report":"missing"}'
            echo '```'
            echo
            echo '## Option-family report'
            echo '```json'
            cat .qa-option-artifacts/option-family-qa-report.json || echo '{"report":"missing"}'
            echo '```'
          } > .qa-closure/summary.md

      - name: Upload complete closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-frontend-closure-evidence
          path: |
            .qa-artifacts
            .qa-option-artifacts
            .qa-closure
          if-no-files-found: error
          retention-days: 14
