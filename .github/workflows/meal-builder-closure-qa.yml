name: Meal Builder Frontend Closure QA

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .qa/run-closure.txt
  workflow_dispatch:

concurrency:
  group: meal-builder-authenticated-crud-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FRONTEND_URL: http://127.0.0.1:5173
      BACKEND_URL: https://basicdiet145.onrender.com
      VITE_BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare evidence directories
        run: mkdir -p .qa-artifacts .qa-option-artifacts .qa-closure .qa-debug

      - name: Install project dependencies
        run: npm ci --silent

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Full ESLint
        run: npm run lint

      - name: Full unit and component suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium runtime without changing lockfiles
        run: |
          npm install --no-save --package-lock=false --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Serve the exact production build
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 5173 > .qa-closure/vite-preview.log 2>&1 &
          echo $! > .qa-closure/vite-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo 'Local production build is ready.'
              exit 0
            fi
            sleep 1
          done
          cat .qa-closure/vite-preview.log || true
          exit 1

      - name: Authenticated direct-card CRUD, validation, delete, and mobile QA
        run: node .qa/meal-builder-authenticated-qa.mjs

      - name: Reversible option-family picker and PUT-items QA
        id: option_qa
        continue-on-error: true
        run: node .qa/meal-builder-option-family-qa.mjs

      - name: Persist option-family evidence for inspection
        if: always()
        run: |
          cp .qa-option-artifacts/option-family-qa-report.json .qa-debug/option-family-latest.json 2>/dev/null || echo '{"report":"missing"}' > .qa-debug/option-family-latest.json
          {
            echo "optionOutcome=${{ steps.option_qa.outcome }}"
            echo "runId=${{ github.run_id }}"
            echo "headSha=$(git rev-parse HEAD)"
          } > .qa-debug/option-family-latest.txt
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -f .qa-debug/option-family-latest.json .qa-debug/option-family-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'test(meal-builder): record option-family closure evidence'
            git push origin HEAD:test/meal-builder-authenticated-crud-qa
          fi

      - name: Repository diff integrity
        run: git diff --check

      - name: Upload compact closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-frontend-closure-evidence
          path: |
            .qa-artifacts/meal-builder-qa-report.json
            .qa-option-artifacts/option-family-qa-report.json
            .qa-closure/vite-preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce option-family QA
        if: steps.option_qa.outcome == 'failure'
        run: exit 1
