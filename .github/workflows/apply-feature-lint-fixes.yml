name: Apply Meal Builder Lint Fixes

on:
  push:
    branches:
      - feat/meal-builder-authoritative-option-groups
    paths:
      - .qa/patch_feature_lint.py
      - .github/workflows/apply-feature-lint-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
          fetch-depth: 0
      - run: python .qa/patch_feature_lint.py
      - name: Commit focused fixes
        run: |
          git config user.name 'Basic Diet Frontend'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests
          git commit -m 'fix(meal-builder): satisfy focused lint and metadata display'
          git push origin HEAD:feat/meal-builder-authoritative-option-groups
