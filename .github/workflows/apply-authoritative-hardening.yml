name: Apply Authoritative Hardening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .qa/patch_authoritative_hardening.py
      - .github/workflows/apply-authoritative-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
          fetch-depth: 0
      - run: python .qa/patch_authoritative_hardening.py
      - name: Commit hardened product code
        run: |
          git config user.name 'Basic Diet Frontend'
          git config user.email 'actions@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(meal-builder): harden authoring and picker reconciliation'
          git push origin HEAD:feat/meal-builder-authoritative-option-groups
