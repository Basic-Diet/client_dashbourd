name: Apply Authoritative Option Groups

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .qa/patch_authoritative_option_groups.py
      - .github/workflows/apply-authoritative-option-groups.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
          fetch-depth: 0
      - name: Narrow ambiguous patch target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.qa/patch_authoritative_option_groups.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              grid,
              \'''  issues,
            pending,
            onEdit,\''',
              \'''  issues,
            pending,
            readOnly = false,
            onEdit,\''',
          )'''
          new = '''replace_once(
              grid,
              \'''export function MealPlannerCardGridV2({
            premiumSection,
            sections,
            issues,
            pending,
            onEdit,\''',
              \'''export function MealPlannerCardGridV2({
            premiumSection,
            sections,
            issues,
            pending,
            readOnly = false,
            onEdit,\''',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one ambiguous grid patch block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply frontend integration patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .qa-debug
          set -o pipefail
          python .qa/patch_authoritative_option_groups.py 2>&1 | tee .qa-debug/patch-error.log
      - name: Commit product changes or diagnostics
        if: always()
        run: |
          git config user.name 'Basic Diet Frontend'
          git config user.email 'actions@users.noreply.github.com'
          if [ '${{ steps.patch.outcome }}' = 'success' ]; then
            git add src tests
            message='feat(meal-builder): consume authoritative builder groups'
          else
            git reset --hard HEAD
            git add -f .qa-debug/patch-error.log
            message='chore(meal-builder): record patch diagnostic'
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:feat/meal-builder-authoritative-option-groups
      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        run: exit 1
