name: Verify Meal Planner V2

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]
    paths:
      - .github/workflows/verify-meal-planner-v2.yml
      - src/components/pages/menu/meal-builder/**
      - src/types/mealPlannerDashboardTypes.ts
      - src/utils/fetchMealPlannerDashboard.ts
      - tests/mealPlannerV2*.test.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-planner-v2-full-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused lint
        run: >-
          npx eslint
          src/components/pages/menu/meal-builder/MealPlannerCandidatePickerV2.tsx
          src/components/pages/menu/meal-builder/MealPlannerCardDialogV2.tsx
          src/components/pages/menu/meal-builder/MealPlannerCardGridV2.tsx
          src/components/pages/menu/meal-builder/MealPlannerItemsDialogV2.tsx
          src/components/pages/menu/meal-builder/MealPlannerWorkspaceV2.tsx
          src/components/pages/menu/meal-builder/mealPlannerV2Utils.ts
          src/types/mealPlannerDashboardTypes.ts
          src/utils/fetchMealPlannerDashboard.ts
          tests/mealPlannerV2Payloads.test.ts
          tests/mealPlannerV2ApiContract.test.ts
      - name: Focused contract tests
        run: npx vitest run tests/mealPlannerV2Payloads.test.ts tests/mealPlannerV2ApiContract.test.ts
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Full lint diagnostics
        continue-on-error: true
        run: npm run lint
