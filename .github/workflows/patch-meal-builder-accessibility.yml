name: Patch Meal Builder Accessibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - run: python .qa/patch_meal_builder_accessibility.py
      - name: Commit form accessibility
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/pages/menu/meal-builder/MealPlannerCardDialogV2.tsx
          git commit -m 'fix(meal-builder): label form controls accessibly'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
