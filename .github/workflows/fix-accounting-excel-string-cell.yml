name: Fix accounting Excel string cell

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/accounting-excel-string-cell'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fix Excel string-cell type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/accounting/accountingCsv.ts')
          text = path.read_text(encoding='utf-8')
          old = '  value: value ?? "",'
          new = '  value: String(value ?? ""),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unsafe string-cell assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run accounting tests
        run: npx vitest run tests/accountingReports.test.ts tests/accountingRangeUx.test.ts
      - name: Build dashboard
        run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/accounting/accountingCsv.ts
          git commit -m "fix(accounting): normalize Excel string cells"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
