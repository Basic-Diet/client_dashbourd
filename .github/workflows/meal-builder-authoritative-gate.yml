name: Meal Builder Authoritative Integration Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Full ESLint
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff integrity
        run: git diff --check
