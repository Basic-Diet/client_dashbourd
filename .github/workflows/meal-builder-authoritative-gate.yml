name: Meal Builder Authoritative Integration Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-authoritative-option-groups
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prepare diagnostics
        run: mkdir -p .qa-diagnostics
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .qa-diagnostics/typecheck.log
      - name: Full ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .qa-diagnostics/lint.log
      - name: Full test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee .qa-diagnostics/tests.log
      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .qa-diagnostics/build.log
      - name: Diff integrity
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee .qa-diagnostics/diff.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-authoritative-gate-diagnostics
          path: .qa-diagnostics
          retention-days: 7
      - name: Enforce gate
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          printf 'typecheck=%s lint=%s tests=%s build=%s diff=%s\n' \
            "$TYPECHECK_OUTCOME" "$LINT_OUTCOME" "$TESTS_OUTCOME" \
            "$BUILD_OUTCOME" "$DIFF_OUTCOME"
          test "$TYPECHECK_OUTCOME" = success
          test "$LINT_OUTCOME" = success
          test "$TESTS_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$DIFF_OUTCOME" = success
