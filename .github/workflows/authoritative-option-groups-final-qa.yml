name: Authoritative Option Groups Final QA

on:
  pull_request:
    branches:
      - feat/meal-builder-authoritative-option-groups
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/meal-builder-authoritative-final
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run tests/mealPlannerAuthoritativeOptionGroups.test.tsx
