name: Authoritative Option Groups Final QA

on:
  pull_request:
    branches:
      - feat/meal-builder-authoritative-option-groups
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/authoritative-option-groups-final-qa.yml
      - .qa/authoritative-option-groups-qa.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/meal-builder-authoritative-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Run focused test
        id: focused
        continue-on-error: true
        run: |
          mkdir -p .qa-debug
          npx vitest run tests/mealPlannerAuthoritativeOptionGroups.test.tsx > .qa-debug/focused-test.log 2>&1
      - name: Commit focused diagnostic
        if: always()
        run: |
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -f .qa-debug/focused-test.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(meal-builder): record focused failure'
          git push origin HEAD:qa/meal-builder-authoritative-final
      - name: Enforce focused test
        if: steps.focused.outcome == 'failure'
        run: exit 1
