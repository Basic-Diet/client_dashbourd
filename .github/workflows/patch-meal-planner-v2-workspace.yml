name: Patch Meal Planner V2 Workspace

on:
  push:
    branches:
      - feat/meal-planner-v2-full-contract
    paths:
      - .github/workflows/patch-meal-planner-v2-workspace.yml
      - .github/scripts/patch_meal_planner_v2_workspace.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-planner-v2-full-contract
          fetch-depth: 0
      - run: python .github/scripts/patch_meal_planner_v2_workspace.py
      - name: Commit lifecycle integration
        run: |
          git config user.name "Basic Diet Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/pages/menu/meal-builder/MealPlannerWorkspaceV2.tsx
          git commit -m "feat(meal-planner): complete item and readiness lifecycle"
          git push origin HEAD:feat/meal-planner-v2-full-contract
