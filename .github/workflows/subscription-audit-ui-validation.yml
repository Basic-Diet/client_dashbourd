name: Subscription audit UI validation

on:
  push:
    branches:
      - audit/subscription-operations-ui
    paths:
      - "src/routes/_protected/subscription-audit/**"
      - ".github/workflows/subscription-audit-ui-validation.yml"
  pull_request:
    paths:
      - "src/routes/_protected/subscription-audit/**"
      - "src/routeTree.gen.ts"
      - ".github/workflows/subscription-audit-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate TanStack route tree
        run: npx --yes @tanstack/router-cli@1.166.7 generate
      - name: Typecheck and build
        run: npm run build
      - name: Commit generated route tree
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore(router): register subscription audit route"
          git push
