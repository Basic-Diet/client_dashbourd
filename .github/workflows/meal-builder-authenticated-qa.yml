name: Meal Builder Authenticated CRUD QA

on:
  push:
    branches:
      - test/meal-builder-authenticated-crud-qa
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p .qa-static
      - run: npm ci --silent
      - run: npm run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .qa-static/lint.log
      - run: npm test
      - run: npm run build
      - name: Comment static QA result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Static Meal Builder QA'
            echo
            echo '- Typecheck: `${{ steps.lint.outcome == ''skipped'' && ''unknown'' || ''passed before lint'' }}`'
            echo '- Lint outcome: `${{ steps.lint.outcome }}`'
            echo
            echo '<details><summary>Lint output</summary>'
            echo
            echo '```text'
            tail -n 80 .qa-static/lint.log || true
            echo '```'
            echo '</details>'
          } > .qa-static/comment.md
          gh pr comment '${{ github.event.pull_request.number }}' --body-file .qa-static/comment.md
      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: exit 1

  browser:
    needs: static
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRONTEND_URL: https://basic-dite-dashbourd.vercel.app
      BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p .qa-artifacts
      - name: Install browser runtime
        run: |
          npm ci --silent
          npm install --no-save --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Run authenticated Meal Builder CRUD journey
        id: browser_qa
        continue-on-error: true
        run: node .qa/meal-builder-authenticated-qa.mjs
      - name: Comment browser QA result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Authenticated Meal Builder Browser QA'
            echo
            echo '- Browser outcome: `${{ steps.browser_qa.outcome }}`'
            echo
            echo '```json'
            cat .qa-artifacts/meal-builder-qa-report.json || echo '{"report":"missing"}'
            echo '```'
          } > .qa-artifacts/comment.md
          gh pr comment '${{ github.event.pull_request.number }}' --body-file .qa-artifacts/comment.md
      - name: Upload QA screenshots, trace, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-authenticated-qa
          path: .qa-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce browser QA
        if: steps.browser_qa.outcome == 'failure'
        run: exit 1
