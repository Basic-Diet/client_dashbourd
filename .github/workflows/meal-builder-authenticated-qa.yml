name: Meal Builder Authenticated CRUD QA

on:
  push:
    branches:
      - test/meal-builder-authenticated-crud-qa
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRONTEND_URL: https://basic-dite-dashbourd.vercel.app
      BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p .qa-artifacts
      - name: Install browser runtime
        run: |
          npm ci --silent
          npm install --no-save --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Run authenticated Meal Builder CRUD journey
        run: node .qa/meal-builder-authenticated-qa.mjs
      - name: Print QA report
        if: always()
        run: |
          echo '--- meal-builder-qa-report.json ---'
          cat .qa-artifacts/meal-builder-qa-report.json || true
      - name: Upload QA screenshots, trace, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-authenticated-qa
          path: .qa-artifacts
          if-no-files-found: warn
          retention-days: 14
