name: Meal Builder Authenticated CRUD QA

on:
  push:
    branches:
      - test/meal-builder-authenticated-crud-qa
    paths:
      - .qa/run-authenticated-crud.txt
  workflow_dispatch:

concurrency:
  group: meal-builder-authenticated-crud-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p .qa-static
      - run: npm ci --silent
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .qa-static/lint.log
      - name: Tests
        id: tests
        run: npm test
      - name: Build
        id: build
        run: npm run build
      - name: Comment static QA result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Serialized Static Meal Builder QA'
            echo
            echo '- Typecheck outcome: `${{ steps.typecheck.outcome }}`'
            echo '- Lint outcome: `${{ steps.lint.outcome }}`'
            echo '- Tests outcome: `${{ steps.tests.outcome }}`'
            echo '- Build outcome: `${{ steps.build.outcome }}`'
          } > .qa-static/comment.md
          gh pr comment 84 --body-file .qa-static/comment.md
      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: exit 1

  browser:
    needs: static
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_URL: http://127.0.0.1:5173
      BACKEND_URL: https://basicdiet145.onrender.com
      VITE_BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p .qa-artifacts
      - name: Clean known QA keys before browser CRUD
        env:
          CLEANUP_KEYS: qa_1784504803186_direct_updated,qa_1784504803186_direct,qa_1784501133630_direct_updated,qa_1784501133630_direct
          RUN_CRUD_PROBE: "false"
        shell: bash
        run: |
          set -o pipefail
          node .qa/meal-builder-api-probe.mjs 2>&1 | tee .qa-artifacts/api-probe.log
      - name: Install dependencies and Chromium
        run: |
          npm ci --silent
          npm install --no-save --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Build and serve the fixed branch locally
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 5173 > .qa-artifacts/vite-preview.log 2>&1 &
          echo $! > .qa-artifacts/vite-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo 'Local production build is ready.'
              exit 0
            fi
            sleep 1
          done
          cat .qa-artifacts/vite-preview.log || true
          exit 1
      - name: Run authenticated Meal Builder CRUD journey
        id: browser_qa
        continue-on-error: true
        run: node .qa/meal-builder-authenticated-qa.mjs
      - name: Comment browser QA result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Serialized Authenticated Meal Builder Browser QA'
            echo
            echo '- Browser outcome: `${{ steps.browser_qa.outcome }}`'
            echo '- Frontend under test: local production build on approved CORS origin'
            echo
            echo '```json'
            cat .qa-artifacts/meal-builder-qa-report.json || echo '{"report":"missing"}'
            echo '```'
          } > .qa-artifacts/comment.md
          gh pr comment 84 --body-file .qa-artifacts/comment.md
      - name: Upload QA screenshots, trace, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-authenticated-qa
          path: .qa-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce browser QA
        if: steps.browser_qa.outcome == 'failure'
        run: exit 1
