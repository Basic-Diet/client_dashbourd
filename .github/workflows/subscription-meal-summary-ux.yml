name: Subscription meal summary UX

on:
  pull_request:
    paths:
      - "src/components/pages/subscriptions/SubscriptionQuickViewDialog.tsx"
      - "src/components/pages/subscriptions/SubscriptionTrackingExperienceV7.tsx"
      - "tests/subscriptionMealSummaryUx.test.ts"
      - ".github/workflows/subscription-meal-summary-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused UX tests
        run: npx vitest run tests/subscriptionMealSummaryUx.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
