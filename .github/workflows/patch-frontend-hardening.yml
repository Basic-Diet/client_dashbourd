name: Patch Meal Builder Frontend Hardening

on:
  push:
    branches:
      - test/meal-builder-authenticated-crud-qa
    paths:
      - .qa/patch_frontend_hardening.py
      - .github/workflows/patch-frontend-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - run: python .qa/patch_frontend_hardening.py
      - name: Commit frontend hardening
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/components/pages/menu/meal-builder/MealPlannerWorkspaceV2.tsx \
            src/components/pages/menu/meal-builder/mealPlannerV2Utils.ts
          git commit -m 'fix(meal-builder): refresh pickers and complete error handling'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
