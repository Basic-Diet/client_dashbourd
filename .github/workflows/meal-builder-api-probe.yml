name: Meal Builder API Contract Probe

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .qa/meal-builder-api-probe.mjs
      - .github/workflows/meal-builder-api-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
      CLEANUP_KEYS: qa_1784501133630_direct_updated,qa_1784501133630_direct
      RUN_CRUD_PROBE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p .qa-probe
      - name: Run cleanup and contract probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .qa/meal-builder-api-probe.mjs 2>&1 | tee .qa-probe/probe.log
      - name: Commit probe evidence
        if: always()
        run: |
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -f .qa-probe/probe.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(meal-builder): record production API probe evidence'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
      - name: Enforce probe result
        if: steps.probe.outcome == 'failure'
        run: exit 1
