name: Finalize Meal Builder Guard

on:
  pull_request:
    branches:
      - main
    types: [reopened]
    paths:
      - .github/workflows/finalize-meal-builder-guard.yml
      - tests/mealBuilderDirectCardsUi.test.tsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-simplified-workspace-ux
          fetch-depth: 0

      - name: Add synchronous action guard and localized inline issues
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx")
          content = path.read_text(encoding="utf-8")

          old_import = 'import { useDeferredValue, useEffect, useMemo, useState } from "react";'
          new_import = 'import { useDeferredValue, useEffect, useMemo, useRef, useState } from "react";'
          if old_import in content:
              content = content.replace(old_import, new_import, 1)
          elif new_import not in content:
              raise RuntimeError("React import shape was not recognized")

          picker_import = 'import { isDirectMealBuilderCandidateSelectable } from "./mealBuilderFrontendUtils";\n'
          issue_import = 'import { mealBuilderIssueText } from "./mealBuilderIssueText";\n'
          if issue_import not in content:
              if picker_import not in content:
                  raise RuntimeError("Picker helper import was not found")
              content = content.replace(picker_import, picker_import + issue_import, 1)

          query_client = '  const queryClient = useQueryClient();\n'
          action_lock = '  const actionLockRef = useRef(false);\n'
          if action_lock not in content:
              query_index = content.find(query_client)
              if query_index < 0:
                  raise RuntimeError("Query client declaration was not found")
              insert_at = query_index + len(query_client)
              content = content[:insert_at] + action_lock + content[insert_at:]

          run_start = content.find('  async function runAction(')
          run_end = content.find('  async function updateVisibility(', run_start)
          if run_start < 0 or run_end < 0:
              raise RuntimeError("runAction boundaries were not found")
          run_block = content[run_start:run_end]

          old_guard = '    if (pending) return;'
          new_guard = '    if (pending || actionLockRef.current) return;\n    actionLockRef.current = true;'
          if new_guard not in run_block:
              if old_guard not in run_block:
                  raise RuntimeError("runAction pending guard was not found")
              run_block = run_block.replace(old_guard, new_guard, 1)

          old_catch_end = '''      toast.error(cardActionErrorMessage(error));
              throw error;
            }
          }

          '''
          new_catch_end = '''      toast.error(cardActionErrorMessage(error));
              throw error;
            } finally {
              actionLockRef.current = false;
            }
          }

          '''
          if 'actionLockRef.current = false;' not in run_block:
              if old_catch_end not in run_block:
                  compact_old = '''      toast.error(cardActionErrorMessage(error));
              throw error;
            }
          }
'''
                  compact_new = '''      toast.error(cardActionErrorMessage(error));
              throw error;
            } finally {
              actionLockRef.current = false;
            }
          }
'''
                  if compact_old not in run_block:
                      raise RuntimeError("runAction catch ending was not found")
                  run_block = run_block.replace(compact_old, compact_new, 1)
              else:
                  run_block = run_block.replace(old_catch_end, new_catch_end, 1)

          content = content[:run_start] + run_block + content[run_end:]

          content = content.replace(
              '{issueMessage(issues[0])}',
              '{localizedIssueMessage(issues[0])}',
              1,
          )

          helper_start = content.find('function issueMessage(')
          helper_end = content.find('function candidateName(', helper_start)
          if helper_start >= 0:
              if helper_end < 0:
                  raise RuntimeError("issueMessage helper ending was not found")
              localized_helper = '''function localizedIssueMessage(issue: MealBuilderCheck) {
            const localized = mealBuilderIssueText({
              ...issue,
              message: undefined,
              title: undefined,
            });
            return /[\\u0600-\\u06FF]/.test(localized)
              ? localized
              : "توجد مشكلة تحتاج مراجعة في هذه البطاقة.";
          }

          '''
              content = content[:helper_start] + localized_helper + content[helper_end:]
          elif 'function localizedIssueMessage(' not in content:
              raise RuntimeError("Issue helper was not found")

          path.write_text(content, encoding="utf-8")

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused lint
        run: >-
          npx eslint
          src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx
          src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx
          tests/mealBuilderDirectCardsUi.test.tsx

      - name: Focused lifecycle tests
        run: npx vitest run tests/mealBuilderDirectCardsUi.test.tsx

      - name: Full tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified lifecycle guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Basic Diet Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx
          git commit -m "fix(meal-builder): guard lifecycle actions and localize issues"
          git push origin HEAD:feat/meal-builder-simplified-workspace-ux
