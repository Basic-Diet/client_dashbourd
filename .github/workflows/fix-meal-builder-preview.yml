name: Fix Meal Builder Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-meal-builder-preview.yml
  push:
    branches:
      - feat/meal-builder-simplified-workspace-ux
    paths:
      - .github/workflows/fix-meal-builder-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-simplified-workspace-ux
          fetch-depth: 0

      - name: Apply preview build fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "const response = await validateDraft.mutateAsync();",
              "const response = await validateDraft.mutateAsync(undefined);",
          )
          content = content.replace(
              '<DropdownMenuContent align="end" className="min-w-52" dir="rtl">',
              '<DropdownMenuContent align="end" className="min-w-52 text-right">',
          )
          path.write_text(content, encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused lint
        run: >-
          npx eslint
          src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx
          src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx
          src/components/pages/menu/meal-builder/MealBuilderSimplePage.tsx

      - name: Full tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Basic Diet Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx
          git commit -m "fix(meal-builder): repair preview build"
          git push origin HEAD:feat/meal-builder-simplified-workspace-ux
