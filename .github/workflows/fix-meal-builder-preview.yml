name: Verify Meal Builder PR

on:
  push:
    branches:
      - feat/meal-builder-simplified-workspace-ux
    paths:
      - .github/workflows/fix-meal-builder-preview.yml
      - .meal-builder-trigger/**
      - src/components/pages/menu/meal-builder/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-simplified-workspace-ux
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused lint
        run: >-
          npx eslint
          src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx
          src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx
          src/components/pages/menu/meal-builder/MealBuilderSimplePage.tsx

      - name: Full tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check
