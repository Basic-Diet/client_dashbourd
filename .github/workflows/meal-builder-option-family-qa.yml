name: Meal Builder Option Family QA

on:
  push:
    branches:
      - test/meal-builder-authenticated-crud-qa
    paths:
      - .qa/run-option-family.txt
  workflow_dispatch:

concurrency:
  group: meal-builder-authenticated-crud-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  option-family:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_URL: http://127.0.0.1:5173
      BACKEND_URL: https://basicdiet145.onrender.com
      VITE_BACKEND_URL: https://basicdiet145.onrender.com
      QA_EMAIL: admin@basicdiet.com
      QA_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: mkdir -p .qa-option-artifacts
      - name: Install dependencies and Chromium
        run: |
          npm ci --silent
          npm install --no-save --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Typecheck, lint, tests, and build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Serve the fixed branch locally
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 5173 > .qa-option-artifacts/vite-preview.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .qa-option-artifacts/vite-preview.log || true
          exit 1
      - name: Run reversible option-family journey
        id: option_qa
        continue-on-error: true
        run: node .qa/meal-builder-option-family-qa.mjs
      - name: Publish option-family QA evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Reversible Option-Family Browser QA'
            echo
            echo '- Outcome: `${{ steps.option_qa.outcome }}`'
            echo '- Original Backend option list is restored in all paths.'
            echo
            echo '```json'
            cat .qa-option-artifacts/option-family-qa-report.json || echo '{"report":"missing"}'
            echo '```'
          } > .qa-option-artifacts/comment.md
          gh pr comment 84 --body-file .qa-option-artifacts/comment.md
      - name: Upload option-family artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-option-family-qa
          path: .qa-option-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce option-family QA
        if: steps.option_qa.outcome == 'failure'
        run: exit 1
