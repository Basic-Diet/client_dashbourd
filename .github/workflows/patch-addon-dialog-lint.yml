name: Patch QA Harness

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .qa/patch_preview_access.py
      - .github/workflows/patch-addon-dialog-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - run: python .qa/patch_preview_access.py
      - name: Commit preview access support
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .qa/meal-builder-authenticated-qa.mjs
          git commit -m 'test(meal-builder): authenticate protected Vercel preview'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
