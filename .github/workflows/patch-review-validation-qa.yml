name: Patch Review Validation QA

on:
  push:
    branches:
      - test/meal-builder-authenticated-crud-qa
    paths:
      - .qa/patch_review_validation_qa.py
      - .github/workflows/patch-review-validation-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - run: python .qa/patch_review_validation_qa.py
      - name: Commit validation QA fix
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .qa/meal-builder-authenticated-qa.mjs
          git commit -m 'test(meal-builder): validate review dialog without publishing'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
