name: Patch Meal Builder Card Copy

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .qa/patch_meal_builder_card_copy.py
      - .github/workflows/patch-meal-builder-card-copy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - run: python .qa/patch_meal_builder_card_copy.py
      - name: Commit Meal Builder UX copy and QA assertions
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/components/pages/menu/meal-builder/MealPlannerCardGridV2.tsx \
            tests/mealPlannerV2Components.test.tsx \
            .qa/meal-builder-authenticated-qa.mjs
          git commit -m 'fix(meal-builder): replace technical card copy with clear Arabic labels'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
