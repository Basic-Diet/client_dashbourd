name: Validate final accounting dashboard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/accounting-reports-final'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Default accounting to today
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_protected/accounting/index.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'const [reportMode, setReportMode] = useState<AccountingReportMode>("range");'
          new = 'const [reportMode, setReportMode] = useState<AccountingReportMode>("daily");'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('accounting default mode contract not found')
          PY
      - name: Run accounting tests
        run: npx vitest run tests/accountingReports.test.ts tests/accountingRangeUx.test.ts
      - name: Build dashboard
        run: npm run build
      - name: Persist validated default mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_protected/accounting/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix(accounting): default to today's report"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
