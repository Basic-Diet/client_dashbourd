name: Apply accounting Excel UI fix

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-accounting-reports-excel'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused UI patch
        run: python3 scripts/apply_accounting_excel_ui_fix.py
      - name: Run focused accounting tests
        run: npx vitest run tests/accountingReports.test.ts tests/accountingRangeUx.test.ts
      - name: Build production dashboard
        run: npm run build
      - name: Remove temporary patch files from branch
        run: git rm scripts/apply_accounting_excel_ui_fix.py .github/workflows/apply-accounting-excel-ui-fix.yml
      - name: Commit validated fix to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/accounting/accountingTypes.ts src/routes/_protected/accounting/index.tsx src/features/accounting/components/SubscriptionPaymentsReport.tsx
          git commit -m "fix(accounting): expose Moyasar and export formatted Excel" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
