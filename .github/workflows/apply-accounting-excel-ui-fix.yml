name: Apply accounting Excel UI fix

on:
  push:
    branches:
      - agent/fix-accounting-reports-excel
    paths:
      - scripts/apply_accounting_excel_ui_fix.py
      - .github/workflows/apply-accounting-excel-ui-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-accounting-reports-excel
          fetch-depth: 0
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused UI patch
        run: python3 scripts/apply_accounting_excel_ui_fix.py
      - name: Run focused accounting tests
        run: npx vitest run tests/accountingReports.test.ts tests/accountingRangeUx.test.ts
      - name: Build production dashboard
        run: npm run build
      - name: Remove temporary patch files
        run: git rm scripts/apply_accounting_excel_ui_fix.py .github/workflows/apply-accounting-excel-ui-fix.yml
      - name: Commit applied fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/accounting/accountingTypes.ts src/routes/_protected/accounting/index.tsx src/features/accounting/components/SubscriptionPaymentsReport.tsx tests/accountingReports.test.ts
          git commit -m "fix(accounting): clarify Moyasar and export formatted Excel [accounting-fix-applied]"
          git push origin HEAD:agent/fix-accounting-reports-excel
