name: Fix Option QA Selectors

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/fix-option-qa-selectors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/meal-builder-authenticated-crud-qa
          fetch-depth: 0
      - name: Apply exact visible-label selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.qa/meal-builder-option-family-qa.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'await createDialog.getByText("نوع الخيارات").waitFor();': 'await createDialog.getByText("نوع الخيارات", { exact: true }).waitFor();',
              'await createDialog.getByText("المنتج الأساسي").waitFor();': 'await createDialog.getByText("المنتج الأساسي", { exact: true }).waitFor();',
              'await createDialog.getByText("مجموعة الخيارات").waitFor();': 'await createDialog.getByText("مجموعة الخيارات", { exact: true }).waitFor();',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one selector: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit selector correction
        run: |
          git config user.name 'Basic Diet QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .qa/meal-builder-option-family-qa.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(meal-builder): target option form labels exactly'
          git push origin HEAD:test/meal-builder-authenticated-crud-qa
