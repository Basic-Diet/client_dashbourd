name: Assemble Meal Builder UX

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/assemble-meal-builder.yml
      - .meal-builder-payload/**
  push:
    branches:
      - feat/meal-builder-simplified-workspace-ux
    paths:
      - .github/workflows/assemble-meal-builder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/meal-builder-simplified-workspace-ux
          fetch-depth: 0

      - name: Assemble source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/components/pages/menu/meal-builder

          (
            cat .meal-builder-payload/direct.*.b64
            printf '%s' ''
          ) | base64 --decode > src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx

          cat .meal-builder-payload/page.*.part > src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx

          cat > src/components/pages/menu/meal-builder/MealBuilderSimplePage.tsx <<'EOF'
          export {
            MealBuilderSimplifiedPage as MealBuilderSimplePage,
            type MealBuilderNavigationState,
          } from "./MealBuilderSimplifiedPage";
          EOF

          rm -rf .meal-builder-payload
          git rm .github/workflows/assemble-meal-builder.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused lint
        id: focused_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            src/components/pages/menu/meal-builder/MealBuilderDirectCards.tsx \
            src/components/pages/menu/meal-builder/MealBuilderSimplifiedPage.tsx \
            src/components/pages/menu/meal-builder/MealBuilderSimplePage.tsx \
            2>&1 | tee meal-builder-focused-lint.log

      - name: Upload focused lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-focused-lint
          path: meal-builder-focused-lint.log

      - name: Full tests
        run: npm run test

      - name: Production build
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee meal-builder-build.log

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-builder-build
          path: meal-builder-build.log

      - name: Diff check
        run: git diff --check

      - name: Commit verified UX implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f meal-builder-focused-lint.log meal-builder-build.log
          git config user.name "Basic Diet Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(meal-builder): simplify card management workspace"
          git push origin HEAD:feat/meal-builder-simplified-workspace-ux

      - name: Enforce verification results
        if: steps.focused_lint.outcome == 'failure' || steps.production_build.outcome == 'failure'
        run: exit 1
