name: Finalize Meal Planner V2

on:
  pull_request:
    branches:
      - main
    types: [reopened]
    paths:
      - .github/workflows/finalize-meal-planner-v2.yml
      - .github/scripts/finalize_meal_planner_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-planner-v2-full-contract
          fetch-depth: 0
      - run: python .github/scripts/finalize_meal_planner_v2.py
      - name: Commit final contract fixes
        run: |
          git config user.name "Basic Diet Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/pages/menu/meal-builder/MealPlannerCardDialogV2.tsx src/utils/fetchMealPlannerDashboard.ts
          git commit -m "fix(meal-planner): enforce complete canonical forms"
          git push origin HEAD:feat/meal-planner-v2-full-contract
