name: Apply Addon Dialog Lint Fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .qa/patch_addon_dialog_lint.py
      - .github/workflows/apply-addon-dialog-lint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/addon-dialog-full-lint
          fetch-depth: 0
      - name: Apply patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .qa-debug
          set -o pipefail
          python .qa/patch_addon_dialog_lint.py 2>&1 | tee .qa-debug/addon-patch.log
      - name: Commit product fix or diagnostic
        if: always()
        run: |
          git config user.name 'Basic Diet Frontend'
          git config user.email 'actions@users.noreply.github.com'
          if [ '${{ steps.patch.outcome }}' = success ]; then
            npm ci --silent
            npm run typecheck
            npx eslint src/components/pages/addons/AddonPlanDialog.tsx
            git add src/components/pages/addons/AddonPlanDialog.tsx
            message='fix(addons): reset product filters through reducer'
          else
            git reset --hard HEAD
            git add -f .qa-debug/addon-patch.log
            message='chore(addons): record patch diagnostic'
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:fix/addon-dialog-full-lint
      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        run: exit 1
